<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤더 날씨 타일 시안, 온도 유지, 도시명과 상태 한 단계 축소</title>
<style>
  body { margin: 0; padding: 16px; background: #f4f4f2; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; color: #1a1a1a; }
  .wrap { max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  h2 { font-size: 16px; font-weight: 500; margin: 18px 0 4px; }
  .label { font-size: 12px; color: #666; }
  .head { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px; border: 0.5px solid #d6d6d2; border-radius: 12px; background: #fff; }
  .brand { font-size: 16px; font-weight: 500; }
  .login { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 0.5px solid #9a9a96; background: #fff; }
  .tile { position: relative; width: 104px; height: 48px; border-radius: 10px; overflow: hidden; background-size: cover; background-position: center; color: #fff; }
  .tile::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.38); }
  .txt { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 0 2px rgba(0,0,0,0.35); }
  .city { font-size: 10px; line-height: 1.1; }
  .temp { font-size: 18px; font-weight: 500; line-height: 1.1; }
  .state { font-size: 10px; line-height: 1.1; }
  .note { font-size: 12px; color: #666; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">온도 18px을 유지하고 도시명과 날씨 상태를 한 단계 줄인 헤더 날씨 타일 시안</h2>
<div class="wrap">
  <h2>맑음</h2>
  <div class="head"><span class="brand">SV Career</span><div class="tile" style="background-image:url('weather-header-tile-img/r1c1.jpg')"><div class="txt"><span class="city">Seoul</span><span class="temp">12°</span><span class="state">맑음</span></div></div><span class="login">로그인</span></div>

  <h2>천둥번개</h2>
  <div class="head"><span class="brand">SV Career</span><div class="tile" style="background-image:url('weather-header-tile-img/r2c4.jpg')"><div class="txt"><span class="city">Seoul</span><span class="temp">14°</span><span class="state">천둥번개</span></div></div><span class="login">로그인</span></div>

  <h2>비</h2>
  <div class="head"><span class="brand">SV Career</span><div class="tile" style="background-image:url('weather-header-tile-img/r2c3.jpg')"><div class="txt"><span class="city">Seoul</span><span class="temp">11°</span><span class="state">비</span></div></div><span class="login">로그인</span></div>

  <div class="note">온도는 18px로 그대로 두었습니다. Seoul과 날씨 상태는 11px에서 10px로 줄였습니다. 온도와 Seoul 표기는 임시 값입니다.</div>
</div>
</body>
</html>
