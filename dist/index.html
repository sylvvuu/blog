:root {
  --brand: #1f4e79;
  --text: #1e2630;
  --muted: #6b7785;
  --line: #e3e8ee;
  --bg: #f7f9fb;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
a { color: var(--brand); text-decoration: none; }
header.site { background: #fff; border-bottom: 1px solid var(--line); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
header.site .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); }
nav a { margin-left: 22px; color: var(--muted); font-size: 15px; }
nav a:hover { color: var(--brand); }
main { padding: 40px 0 80px; min-height: 70vh; }
.hero { margin-bottom: 28px; }
.hero h1 { margin: 0 0 6px; font-size: 28px; }
.hero p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px; color: var(--text); transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.07); transform: translateY(-2px); }
.card h3 { margin: 10px 0 8px; font-size: 18px; line-height: 1.4; }
.card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.card time, .post time { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--brand); background: #e8f0f8; border-radius: 4px; padding: 3px 8px; }
.post { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 40px; max-width: 760px; margin: 0 auto; }
.post h1 { margin: 12px 0 6px; font-size: 28px; line-height: 1.35; }
.post .body p { margin: 0 0 16px; }
.back { display: inline-block; margin-bottom: 20px; font-size: 14px; }
.meta { display: grid; grid-template-columns: 80px 1fr; gap: 6px 14px; background: var(--bg); padding: 16px 18px; border-radius: 8px; margin: 20px 0; font-size: 14px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.empty, .loading { color: var(--muted); padding: 40px 0; text-align: center; }
.notice { background: #fff8e6; border: 1px solid #f0d78c; padding: 16px; border-radius: 8px; }
footer.site { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; background: #fff; }

/* 채용 상세 헤더 */
.job-head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.job-head h1 { margin: 10px 0 8px; font-size: 26px; }
.job-sub { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
.job-period { margin: 0; color: var(--muted); font-size: 14px; }
.job-actions { display: flex; flex-direction: column; gap: 8px; min-width: 180px; }
.job-actions .msg { min-height: 0; margin: 0; }
.pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 4px 12px; }
.pill.open { background: #e6f2ea; color: #1d6b3a; }
.pill.closed { background: #eceff2; color: #6b7785; }
.btn { display: block; text-align: center; padding: 12px 16px; border-radius: 8px; border: 1px solid #cfd7e0; font-size: 15px; cursor: pointer; font-family: inherit; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.ghost { background: #fff; color: var(--text); }
.btn.muted { background: #eef2f6; color: var(--muted); border-color: #eef2f6; cursor: default; }
.bottom-nav { text-align: center; margin-top: 32px; }
.bottom-nav .btn { display: inline-block; min-width: 180px; }

/* 글 반응 버튼과 댓글 */
.actions { display: flex; gap: 10px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.act { display: inline-flex; gap: 6px; align-items: center; background: #fff; color: var(--text); border: 1px solid #cfd7e0; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.act strong { color: var(--brand); }
.act[aria-pressed="true"] { background: #e8f0f8; border-color: var(--brand); }
.comments { margin-top: 36px; }
.comments h2 { font-size: 18px; margin: 0 0 14px; }
.comment-list { list-style: none; padding: 0; margin: 0 0 24px; }
.comment-list li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.c-head { font-size: 14px; margin-bottom: 4px; }
.c-head time { color: var(--muted); font-size: 12px; margin-left: 6px; }
.comment-list p { margin: 0; font-size: 15px; white-space: pre-wrap; }
.comment-form { display: grid; gap: 8px; }
.comment-form input, .comment-form textarea { width: 100%; }
.comment-form textarea { min-height: 100px; }
.comment-form button { justify-self: start; }

/* 메인 배너: 전자 회사 느낌의 남색 배경과 회로 패턴 (직접 그린 SVG) */
.banner { position: relative; overflow: hidden; color: #fff; border-radius: 14px; padding: 48px 40px; margin-bottom: 28px; background: linear-gradient(120deg, #0b2540 0%, #13467a 100%); }
.banner::before { content: ""; position: absolute; inset: 0; opacity: .9; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='160' viewBox='0 0 240 160'><g fill='none' stroke='%2366b3ff' stroke-width='1.5' opacity='.4'><path d='M0 40h60l10 10h50v40h40'/><path d='M240 20h-70l-10 10h-40v50h-40v40'/><path d='M120 160v-30h30'/><path d='M180 120h40'/></g><g fill='%2366b3ff' opacity='.6'><circle cx='60' cy='40' r='3'/><circle cx='180' cy='70' r='3'/><circle cx='150' cy='110' r='3'/></g></svg>"); background-size: 240px 160px; }
.banner .kicker { position: relative; margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; color: #8fc7ff; font-weight: 600; }
.banner h1 { position: relative; margin: 0 0 10px; font-size: 32px; }
.banner p { position: relative; margin: 0; color: #d6e6f5; font-size: 15px; max-width: 560px; }

/* 메인 3개 칼럼: 칼럼 사이 세로선으로 구분 */
.columns { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.col { padding: 28px 26px; min-height: 340px; }
.col + .col { border-left: 1px solid var(--line); }
.col-head h2 { margin: 0 0 6px; font-size: 22px; }
.col-head p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.col-education .col-head h2 { color: var(--brand); }
.col-recruit .col-head h2 { color: #1d6b5a; }
.col-inquiry .col-head h2 { color: #6b4e9b; }
.more { font-size: 14px; font-weight: 600; }
.feature { display: block; background: var(--bg); border-radius: 10px; padding: 16px; margin-top: 16px; color: var(--text); }
.feature h3 { margin: 10px 0 6px; font-size: 17px; line-height: 1.4; }
.feature p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.feature time { color: var(--muted); font-size: 13px; }
.art svg, .thumb svg, .post-art svg { display: block; width: 100%; height: auto; }
.art { margin-top: 12px; max-width: 220px; }
.thumb { background: var(--bg); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.thumb svg { height: 110px; width: 100%; }
.post-art { max-width: 320px; margin: 0 0 24px; }
.auth-btn { font: inherit; font-size: 14px; border: 1px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; margin-left: 16px; }
.login-box { text-align: center; background: var(--bg); border-radius: 10px; padding: 22px; }
.login-box p { margin: 0 0 12px; color: var(--muted); }
.who { font-size: 13px; color: var(--muted); margin: 0; }
.inquiry { max-width: 620px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
.apply-box { margin-top: 28px; background: var(--bg); border-radius: 10px; padding: 22px; }
.apply-box h2 { margin: 0 0 4px; font-size: 18px; }
.apply-box[hidden] { display: none; }

/* 좋아요 하트와 뾰로롱 효과 */
.heart, .book { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -3px; }
.book { stroke-linejoin: round; }
.act[aria-pressed="true"] .heart { fill: #e0457b; stroke: #e0457b; }
.act[aria-pressed="true"] .book { fill: var(--brand); stroke: var(--brand); }
.act { user-select: none; }
.act.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.pop { position: fixed; pointer-events: none; color: #e0457b; width: 20px; height: 20px; z-index: 50; animation: popup .9s ease-out forwards; }
.pop svg { width: 100%; height: 100%; fill: currentColor; stroke: none; }
@keyframes popup {
  0% { transform: translate(0, 0) scale(.4); opacity: 0; }
  15% { opacity: 1; transform: translate(0, -6px) scale(1.2); }
  100% { transform: translate(var(--dx), -70px) rotate(var(--r)) scale(.8); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .pop, .act.bump { display: none; animation: none; } }

@media (max-width: 860px) {
  .columns { grid-template-columns: 1fr; }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); }
}

/* 관리자 */
.admin-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
.admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.admin-grid { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.panel h2 { margin: 0 0 16px; font-size: 17px; }
.login-card { max-width: 380px; margin: 120px auto; text-align: center; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #cfd7e0; border-radius: 6px; background: #fff; }
textarea { min-height: 260px; resize: vertical; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 10px 16px; background: var(--brand); color: #fff; }
button.ghost { background: #eef2f6; color: var(--text); }
button.danger { background: #b03a2e; }
button.link { background: none; color: var(--brand); padding: 4px 0; text-align: left; }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.post-list { list-style: none; padding: 0; margin: 0; }
.post-list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
.msg { font-size: 14px; color: var(--muted); margin-top: 10px; min-height: 20px; }
@media (max-width: 760px) {
  .admin-grid { grid-template-columns: 1fr; }
  .post { padding: 24px; }
}

/* 글 사진 (Unsplash 무료 사진) */
.art img, .thumb img, .post-art img { display: block; width: 100%; height: auto; border-radius: 8px; aspect-ratio: 3 / 2; object-fit: cover; }
.thumb img { height: 130px; aspect-ratio: auto; }
.credit { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* 우측 하단 문의하기 버튼 */
.fab { position: fixed; right: 20px; bottom: 20px; z-index: 50; background: var(--brand); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(31, 78, 121, .28); }
.fab:hover { filter: brightness(1.08); }

</style>

  <script type="module">
// Firebase 웹 앱 설정값. Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 구성에서 복사해 붙여넣으세요.
const firebaseConfig = {
  apiKey: "AIzaSyC6CHywgzwyALWZKEfrZFvo4TT9hjpGyZk",
  authDomain: "sylvi-electronic.firebaseapp.com",
  projectId: "sylvi-electronic",
  storageBucket: "sylvi-electronic.firebasestorage.app",
  messagingSenderId: "852910515729",
  appId: "1:852910515729:web:dcaebdc2f2fc9cd5a4f3b0",
  measurementId: "G-BC6KK97MHL"
};

// 관리자 페이지에 로그인할 수 있는 Google 계정
const ADMIN_EMAIL = "fkdna3@gmail.com";

const COMPANY_NAME = "SY Electronics";



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, getDocs, getDoc, setDoc, deleteDoc, addDoc, updateDoc, doc,
  query, orderBy, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = document.getElementById("app");
const authBtn = document.getElementById("auth-btn");
const isConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");
const fbApp = isConfigured ? initializeApp(firebaseConfig) : null;
const db = fbApp ? getFirestore(fbApp) : null;
const auth = fbApp ? getAuth(fbApp) : null;
let user = null;

const COLUMNS = {
  education: { title: "교육", desc: "임직원의 업무 역량을 키우는 교육 프로그램을 안내합니다. 실무 중심으로 진행하며 본사와 지점 모두 참여할 수 있습니다." },
  recruit: { title: "채용 공고", desc: "SY Electronics와 함께할 인재를 찾습니다. 신입공채와 경력직 채용 공고를 확인해 보세요." },
  inquiry: { title: "문의하기", desc: "채용이나 교육에 관해 궁금한 점을 남겨 주세요. 로그인 후 문의를 남기면 인사팀이 확인합니다." }
};

// 글에 쓰는 그림 (직접 그린 SVG, 외부 이미지 없음)
const ART = {
  ai: '<svg viewBox="0 0 160 110" role="img" aria-label="AI 칩"><rect x="50" y="26" width="60" height="58" rx="8" fill="#1f4e79"/><rect x="63" y="39" width="34" height="32" rx="4" fill="#dbe8f5"/><circle cx="80" cy="55" r="6" fill="#4a90c2"/><path d="M36 40h14M36 55h14M36 70h14M110 40h14M110 55h14M110 70h14" stroke="#1f4e79" stroke-width="4" stroke-linecap="round"/></svg>',
  ax: '<svg viewBox="0 0 160 110" role="img" aria-label="업무 혁신 톱니바퀴"><circle cx="62" cy="55" r="26" fill="none" stroke="#1f4e79" stroke-width="10" stroke-dasharray="8 6"/><circle cx="62" cy="55" r="14" fill="#1f4e79"/><circle cx="110" cy="50" r="18" fill="none" stroke="#4a90c2" stroke-width="8" stroke-dasharray="6 5"/><circle cx="110" cy="50" r="8" fill="#4a90c2"/></svg>',
  recruit: '<svg viewBox="0 0 160 110" role="img" aria-label="팀"><circle cx="58" cy="38" r="12" fill="#1f4e79"/><path d="M38 92c0-22 40-22 40 0z" fill="#1f4e79"/><circle cx="102" cy="38" r="12" fill="#4a90c2"/><path d="M82 92c0-22 40-22 40 0z" fill="#4a90c2"/></svg>',
  career: '<svg viewBox="0 0 160 110" role="img" aria-label="서류 가방"><path d="M62 38V28h36v10" fill="none" stroke="#1f4e79" stroke-width="6"/><rect x="42" y="38" width="76" height="54" rx="6" fill="#1f4e79"/><rect x="42" y="62" width="76" height="4" fill="#dbe8f5"/><rect x="72" y="56" width="16" height="12" rx="2" fill="#dbe8f5"/></svg>',
  education: '<svg viewBox="0 0 160 110" role="img" aria-label="책"><path d="M28 34h52v54H28z" fill="#dbe8f5"/><path d="M80 34h52v54H80z" fill="#4a90c2"/><path d="M80 34v54" stroke="#1f4e79" stroke-width="2"/><path d="M38 50h30M38 62h24M92 50h30M92 62h24" stroke="#1f4e79" stroke-width="3" stroke-linecap="round"/></svg>',
  inquiry: '<svg viewBox="0 0 160 110" role="img" aria-label="대화"><rect x="36" y="28" width="88" height="48" rx="12" fill="#1f4e79"/><path d="M58 76l-8 16 24-16z" fill="#1f4e79"/><rect x="58" y="44" width="44" height="5" rx="2" fill="#dbe8f5"/><rect x="58" y="56" width="28" height="5" rx="2" fill="#dbe8f5"/></svg>'
};
const HEART = '<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.6 2.6 5 6.2 5c2 0 3.5 1.1 4.3 2.5h3C14.3 6.1 15.8 5 17.8 5c3.6 0 5.3 3.6 3.8 6.8C19.5 16.4 12 21 12 21z"/></svg>';
const BOOK = '<svg class="book" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = ts => (ts && ts.toDate ? ts.toDate().toLocaleDateString("ko-KR") : "");
const artOf = p => ART[p.image] || ART[p.category === "recruit" ? "recruit" : "education"];
// 글 그림: 웹에서 찾은 사진(imageUrl)이 있으면 사진, 없으면 직접 그린 SVG
const artHtml = p => p.imageUrl
  ? `<img src="${esc(p.imageUrl)}" alt="" loading="lazy">`
  : artOf(p);
const creditHtml = p => (p.imageCredit ? `<p class="credit">${esc(p.imageCredit)}</p>` : "");

// GA4 이벤트 전송 (index.html의 gtag가 로드된 경우)
function track(name, params = {}) {
  if (typeof window.gtag === "function") window.gtag("event", name, params);
}

function statusOf(p) {
  const d = Date.parse(p.deadline);
  if (!isNaN(d) && d < Date.now() - 86400000) return "마감";
  return "접수중";
}

function safeUrl(u = "") {
  return /^https?:\/\//i.test(u) ? u : "";
}

let cache = null;
async function loadPosts() {
  if (cache) return cache;
  const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
  cache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  return cache;
}

async function signIn() {
  if (!isConfigured) {
    alert("Firebase 설정값을 js/config.js에 입력한 뒤 사용할 수 있습니다.");
    return;
  }
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    console.error("로그인 실패", e);
  }
}

// ---------- 목록 화면 ----------

function featuredCard(p) {
  return `<a class="feature" href="#/post/${esc(p.id)}">
    <div class="art">${artHtml(p)}</div>
    ${p.category === "recruit" ? `<span class="pill ${statusOf(p) === "접수중" ? "open" : "closed"}">${statusOf(p)}</span>` : ""}
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.summary)}</p>
    <time>${fmtDate(p.createdAt)}</time>
  </a>`;
}

function columnBlock(key, list) {
  const c = COLUMNS[key];
  const feat = list[0];
  return `<section class="col col-${key}">
    <header class="col-head">
      <h2>${esc(c.title)}</h2>
      <p>${esc(c.desc)}</p>
      <a class="more" href="#/${key}">전체 보기 (${list.length}) &rarr;</a>
    </header>
    ${feat ? featuredCard(feat) : `<p class="empty">등록된 글이 없습니다.</p>`}
  </section>`;
}

function renderHome(posts) {
  const edu = posts.filter(p => p.category === "education");
  const rec = posts.filter(p => p.category === "recruit");
  app.innerHTML = `<section class="banner"><p class="kicker">SY ELECTRONICS CAREERS</p><h1>채용과 교육 소식</h1><p>교육과 채용 소식을 한곳에서 확인하고, 궁금한 점은 문의하기로 남겨 주세요.</p></section>
  <div class="columns">
    ${columnBlock("education", edu)}
    ${columnBlock("recruit", rec)}
    <section class="col col-inquiry">
      <header class="col-head">
        <h2>${esc(COLUMNS.inquiry.title)}</h2>
        <p>${esc(COLUMNS.inquiry.desc)}</p>
        <a class="more" href="#/inquiry">문의 작성하기 &rarr;</a>
      </header>
      <div class="art">${ART.inquiry}</div>
    </section>
  </div>`;
}

function renderList(key, posts) {
  const c = COLUMNS[key];
  const list = posts.filter(p => p.category === key);
  const body = list.length
    ? `<div class="grid">${list.map(p => `<a class="card" href="#/post/${esc(p.id)}">
        <div class="thumb">${artHtml(p)}</div>
        ${p.category === "recruit" ? `<span class="badge">${esc(p.jobType || "채용")}</span>` : `<span class="badge">교육</span>`}
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.summary)}</p>
        <time>${fmtDate(p.createdAt)}</time>
      </a>`).join("")}</div>`
    : `<p class="empty">등록된 글이 없습니다.</p>`;
  app.innerHTML = `<section class="hero"><h1>${esc(c.title)}</h1><p>${esc(c.desc)}</p></section>${body}`;
}

// ---------- 글 상세 ----------

function heartPop(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span");
    s.className = "pop";
    s.innerHTML = HEART;
    s.style.left = (r.left + r.width / 2 - 10 + (i - 1) * 12) + "px";
    s.style.top = (r.top - 4) + "px";
    s.style.setProperty("--dx", ((i - 1) * 18 + (Math.random() * 10 - 5)) + "px");
    s.style.setProperty("--r", ((i - 1) * 15) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

async function renderPost(posts, id) {
  const p = posts.find(x => x.id === id);
  if (!p) {
    app.innerHTML = `<p class="empty">글을 찾을 수 없습니다. <a href="#/">홈으로</a></p>`;
    return;
  }
  const base = { post_id: id, post_title: p.title, category: p.category };
  const isRec = p.category === "recruit";
  const st = isRec ? statusOf(p) : "";
  const isNew = isRec && p.jobType === "신입공채";
  // 지원하기는 모두 Google 로그인 후 가능
  const applyBtn = !isRec ? "" : isNew
    ? `<button class="btn primary" id="apply-open" type="button">지원하기</button>`
    : (safeUrl(p.applyUrl)
      ? `<button class="btn primary" id="apply-ext" type="button">지원하기</button>`
      : `<span class="btn muted">지원 방법은 인사팀 문의</span>`);
  // 신입 지원: 로그인 계정으로 이름과 이메일만 입력
  const applyPanel = isNew ? `<section id="apply-box" class="apply-box" hidden>
      <h2>신입 지원</h2>
      ${user
        ? `<p class="who">이름과 이메일만 입력하면 지원이 접수됩니다.</p>
      <form id="apply-form" class="comment-form">
        <input id="ap-name" maxlength="20" placeholder="이름" required>
        <input id="ap-email" type="email" maxlength="100" placeholder="이메일 (예: name@example.com)" required>
        <button type="submit">지원 완료하기</button>
        <p class="msg" id="ap-msg"></p>
      </form>`
        : `<div class="login-box"><p>지원은 Google 로그인 후 가능합니다.</p><button class="btn primary" id="apply-login" type="button">Google 로그인</button></div>`}
    </section>` : "";
  const paras = String(p.body || "").split(/\n\s*\n/).map(t => `<p>${esc(t).replace(/\n/g, "<br>")}</p>`).join("");

  app.innerHTML = `<article class="post">
    <a class="back" href="#/${p.category}">&larr; ${esc(COLUMNS[p.category].title)} 목록</a>
    <div class="post-art">${artHtml(p)}${creditHtml(p)}</div>
    <div class="job-head"><div>
      ${isRec ? `<span class="pill ${st === "접수중" ? "open" : "closed"}">${st}</span>` : `<span class="badge">교육</span>`}
      <h1>${esc(p.title)}</h1>
      ${isRec ? `<p class="job-sub"><span class="badge">${esc(p.jobType || "채용")}</span> ${esc(p.location || "")}</p>` : ""}
      ${isRec && p.deadline ? `<p class="job-period">마감 ${esc(p.deadline)}</p>` : ""}
      ${!isRec ? `<time>${fmtDate(p.createdAt)}</time>` : ""}
    </div>
    <div class="job-actions">${applyBtn}</div></div>
    ${applyPanel}
    <div class="body">${paras}</div>

    <div class="actions">
      <button class="act" id="like-btn" aria-pressed="false">${HEART}<span>좋아요</span> <strong id="like-count">0</strong></button>
      <button class="act" id="scrap-btn" aria-pressed="false">${BOOK}<span>스크랩</span> <strong id="scrap-count">0</strong></button>
      <button class="act" id="share-btn">공유하기</button>
    </div>
    <p class="msg" id="action-msg"></p>

    <section id="comments" class="comments">
      <h2>댓글 <span id="comment-count">0</span></h2>
      <ul id="comment-list" class="comment-list"><li class="empty">불러오는 중...</li></ul>
      <div id="comment-box"></div>
    </section>

    <div class="bottom-nav"><a class="btn ghost" href="#/${p.category}">목록으로</a></div>
  </article>`;

  track("post_view", base);

  // 내 상태 확인 (로그인한 경우에만)
  let liked = false, scraped = false, likeCount = p.likes || 0, scrapCount = p.scraps || 0;
  if (user) {
    const [l, s] = await Promise.all([
      getDoc(doc(db, "posts", id, "likes", user.uid)),
      getDoc(doc(db, "users", user.uid, "scraps", id))
    ]);
    liked = l.exists();
    scraped = s.exists();
  }

  const likeBtn = document.getElementById("like-btn");
  const scrapBtn = document.getElementById("scrap-btn");
  const actionMsg = document.getElementById("action-msg");

  function paint() {
    likeBtn.setAttribute("aria-pressed", String(liked));
    scrapBtn.setAttribute("aria-pressed", String(scraped));
    document.getElementById("like-count").textContent = likeCount;
    document.getElementById("scrap-count").textContent = scrapCount;
  }
  paint();

  // 좋아요: 로그인 필요, 누를 때 하트 효과
  likeBtn.onclick = async () => {
    if (!user) return signIn();
    likeBtn.disabled = true;
    const on = !liked;
    try {
      const ref = doc(db, "posts", id, "likes", user.uid);
      if (on) await setDoc(ref, { at: serverTimestamp() });
      else await deleteDoc(ref);
      await updateDoc(doc(db, "posts", id), { likes: increment(on ? 1 : -1) });
      liked = on;
      likeCount = Math.max(0, likeCount + (on ? 1 : -1));
      paint();
      if (on) heartPop(likeBtn);
      track(on ? "post_like" : "post_unlike", base);
    } catch (e) {
      actionMsg.textContent = "좋아요 처리에 실패했습니다: " + e.message;
    } finally {
      likeBtn.disabled = false;
    }
  };

  // 스크랩: 로그인(구글 계정 인증) 후 내 계정에 저장
  scrapBtn.onclick = async () => {
    if (!user) return signIn();
    scrapBtn.disabled = true;
    const on = !scraped;
    try {
      const ref = doc(db, "users", user.uid, "scraps", id);
      if (on) await setDoc(ref, { title: p.title, at: serverTimestamp() });
      else await deleteDoc(ref);
      await updateDoc(doc(db, "posts", id), { scraps: increment(on ? 1 : -1) });
      scraped = on;
      scrapCount = Math.max(0, scrapCount + (on ? 1 : -1));
      paint();
      actionMsg.textContent = on ? "내 계정에 스크랩했습니다." : "스크랩을 취소했습니다.";
      track(on ? "post_scrap" : "post_unscrap", base);
    } catch (e) {
      actionMsg.textContent = "스크랩 처리에 실패했습니다: " + e.message;
    } finally {
      scrapBtn.disabled = false;
    }
  };

  // 공유하기: 현재 주소 공유 또는 복사
  document.getElementById("share-btn").onclick = async () => {
    const link = location.href.split("#")[0] + "#/post/" + id;
    try {
      if (navigator.share) await navigator.share({ title: p.title, url: link });
      else await navigator.clipboard.writeText(link);
      actionMsg.textContent = "공유 링크를 준비했습니다.";
    } catch (e) {
      actionMsg.textContent = "공유에 실패했습니다. 주소창의 주소를 직접 복사해 주세요.";
    }
    track("post_share", base);
  };

  // 경력직 등 외부 지원 링크: 로그인 후 새 창으로 이동
  const applyExt = document.getElementById("apply-ext");
  if (applyExt) {
    applyExt.onclick = () => {
      if (!user) return signIn();
      track("post_apply", base);
      window.open(safeUrl(p.applyUrl), "_blank", "noopener");
    };
  }

  // 신입 지원 폼 열기 (로그인 필요)
  const applyOpen = document.getElementById("apply-open");
  if (applyOpen) {
    applyOpen.onclick = () => {
      if (!user) return signIn();
      const box = document.getElementById("apply-box");
      box.hidden = false;
      box.scrollIntoView({ behavior: "smooth" });
      track("post_apply", base);
    };
    document.getElementById("apply-login")?.addEventListener("click", signIn);
    document.getElementById("apply-form")?.addEventListener("submit", async e => {
      e.preventDefault();
      const out = document.getElementById("ap-msg");
      const name = document.getElementById("ap-name").value.trim().slice(0, 20);
      const email = document.getElementById("ap-email").value.trim().slice(0, 100);
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        out.textContent = "이메일 형식을 확인해 주세요.";
        return;
      }
      try {
        await addDoc(collection(db, "applications"), {
          uid: user.uid,
          postId: id,
          postTitle: p.title,
          name,
          email,
          createdAt: serverTimestamp()
        });
        e.target.reset();
        out.textContent = "지원이 접수되었습니다. 감사합니다.";
        track("post_apply_submit", base);
      } catch (err) {
        out.textContent = "지원 접수에 실패했습니다: " + err.message;
      }
    });
  }

  // 댓글: 로그인 필요
  async function loadComments() {
    const snap = await getDocs(query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc")));
    const list = snap.docs.map(d => d.data());
    document.getElementById("comment-count").textContent = list.length;
    document.getElementById("comment-list").innerHTML = list.length
      ? list.map(c => `<li><div class="c-head"><strong>${esc(c.name)}</strong> <time>${fmtDate(c.createdAt)}</time></div><p>${esc(c.text)}</p></li>`).join("")
      : `<li class="empty">첫 댓글을 남겨 주세요.</li>`;
  }
  await loadComments();

  const box = document.getElementById("comment-box");
  if (!user) {
    box.innerHTML = `<div class="login-box"><p>댓글은 Google 로그인 후 남길 수 있습니다.</p><button class="btn primary" id="comment-login">Google 로그인</button></div>`;
    document.getElementById("comment-login").onclick = signIn;
  } else {
    box.innerHTML = `<form id="comment-form" class="comment-form">
      <p class="who">${esc(user.displayName || user.email)} 님으로 작성</p>
      <textarea id="c-text" maxlength="500" placeholder="댓글을 남겨 주세요 (최대 500자)" required></textarea>
      <button type="submit">댓글 등록</button>
      <p class="msg" id="c-msg"></p>
    </form>`;
    document.getElementById("comment-form").onsubmit = async e => {
      e.preventDefault();
      const text = document.getElementById("c-text").value.trim();
      if (!text) return;
      try {
        await addDoc(collection(db, "posts", id, "comments"), {
          uid: user.uid,
          name: String(user.displayName || user.email || "사용자").slice(0, 20),
          text,
          createdAt: serverTimestamp()
        });
        document.getElementById("c-text").value = "";
        document.getElementById("c-msg").textContent = "댓글이 등록되었습니다.";
        track("post_comment", { ...base, comment_length: text.length });
        await loadComments();
      } catch (err) {
        document.getElementById("c-msg").textContent = "댓글 등록에 실패했습니다: " + err.message;
      }
    };
  }
}

// ---------- 문의하기 ----------

function renderInquiry() {
  const body = user
    ? `<form id="inq-form" class="comment-form">
        <p class="who">${esc(user.email)} 계정으로 문의합니다.</p>
        <input id="q-name" maxlength="20" value="${esc(user.displayName || "")}" placeholder="이름" required>
        <textarea id="q-msg" maxlength="1000" placeholder="문의 내용 (최대 1000자)" required></textarea>
        <button type="submit">문의 보내기</button>
        <p class="msg" id="q-out"></p>
      </form>`
    : `<div class="login-box"><p>문의는 Google 로그인 후 남길 수 있습니다.</p><button class="btn primary" id="inq-login">Google 로그인</button></div>`;
  app.innerHTML = `<section class="hero"><h1>${esc(COLUMNS.inquiry.title)}</h1><p>${esc(COLUMNS.inquiry.desc)}</p></section><div class="inquiry">${body}</div>`;
  if (!user) {
    document.getElementById("inq-login").onclick = signIn;
    return;
  }
  document.getElementById("inq-form").onsubmit = async e => {
    e.preventDefault();
    const out = document.getElementById("q-out");
    try {
      await addDoc(collection(db, "inquiries"), {
        uid: user.uid,
        name: document.getElementById("q-name").value.trim().slice(0, 20),
        email: user.email || "",
        message: document.getElementById("q-msg").value.trim(),
        createdAt: serverTimestamp()
      });
      document.getElementById("q-msg").value = "";
      out.textContent = "문의가 접수되었습니다. 확인 후 답변드리겠습니다.";
      track("inquiry_submit");
    } catch (err) {
      out.textContent = "문의 접수에 실패했습니다: " + err.message;
    }
  };
}

// ---------- 라우팅 ----------

async function route() {
  if (!isConfigured) {
    app.innerHTML = `<div class="notice">Firebase 설정이 필요합니다. js/config.js의 값을 입력해 주세요.</div>`;
    return;
  }
  const hash = location.hash.replace(/^#/, "") || "/";
  if (hash === "/inquiry") return renderInquiry();
  app.innerHTML = `<p class="loading">불러오는 중...</p>`;
  try {
    const posts = await loadPosts();
    if (hash.startsWith("/post/")) return await renderPost(posts, decodeURIComponent(hash.slice(6)));
    if (hash === "/education" || hash === "/recruit") return renderList(hash.slice(1), posts);
    renderHome(posts);
  } catch (e) {
    app.innerHTML = `<div class="notice">글을 불러오지 못했습니다: ${esc(e.message)}</div>`;
  }
}

if (authBtn) authBtn.addEventListener("click", () => (user && isConfigured ? signOut(auth) : signIn()));
window.addEventListener("hashchange", route);

if (isConfigured) {
  // 로그인 상태가 바뀌면 현재 화면을 다시 그린다
  onAuthStateChanged(auth, u => {
    user = u;
    if (authBtn) authBtn.textContent = u ? "로그아웃" : "로그인";
    route();
  });
} else {
  route();
}

</script>
